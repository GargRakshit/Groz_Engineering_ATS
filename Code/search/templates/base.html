<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Application Tracking System{% endblock %}</title>
  <script>(function(){var t=localStorage.getItem('rp-theme')||'light';document.documentElement.setAttribute('data-theme',t);})()</script>
  <style>
    :root {
      --bg:          #f4f4f4;
      --surface:     #ffffff;
      --surface-alt: #f9f9f9;
      --border:      #e0e0e0;
      --border-sub:  #ebebeb;
      --text-1:      #1a1a1a;
      --text-2:      #666666;
      --text-3:      #868e96;
      --accent:      #f47920;
      --accent-h:    #d46010;
      --accent-soft: #fff3ea;
      --nav-bg:      #000000;
      --nav-text:    #f0ece6;
      --input-bg:    #ffffff;
      --input-border:#d0d0d0;
      --card-shadow: 0 1px 3px rgba(0,0,0,.08);
      --badge-ok-bg:    #edfbea; --badge-ok-text:   #2a7a2a;
      --badge-fail-bg:  #fdecea; --badge-fail-text: #b71c1c;
      --badge-na-bg:    #f0f0f0; --badge-na-text:   #868e96;
      --pill-bg:        #efefef; --pill-text:       #555555;
      --pill-match-bg:  #fff3ea; --pill-match-text: #c25a00;
      --pill-miss-bg:   #fdecea; --pill-miss-text:  #b71c1c;
    }
    [data-theme="dark"] {
      --bg:          #000000;
      --surface:     #181818;
      --surface-alt: #1c1c1c;
      --border:      #2a2a2a;
      --border-sub:  #1e1e1e;
      --text-1:      #f0ece6;
      --text-2:      #9a9089;
      --text-3:      #6b6360;
      --accent:      #f47920;
      --accent-h:    #d46010;
      --accent-soft: #1a0e05;
      --nav-bg:      #000000;
      --nav-text:    #f0ece6;
      --input-bg:    #181818;
      --input-border:#2a2a2a;
      --card-shadow: none;
      --badge-ok-bg:    #0d1a08; --badge-ok-text:   #6ee880;
      --badge-fail-bg:  #1a0600; --badge-fail-text: #ff8c8c;
      --badge-na-bg:    #1e1e1e; --badge-na-text:   #888888;
      --pill-bg:        #1e1e1e; --pill-text:       #bcb0a5;
      --pill-match-bg:  #1a0e05; --pill-match-text: #ffb46c;
      --pill-miss-bg:   #1a0600; --pill-miss-text:  #ff9e9e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      font-size: 15px;
    }

    nav {
      background: var(--nav-bg);
      color: var(--nav-text);
      padding: 0 1.5rem;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid #1a1a1a;
    }
    .nav-brand-logo {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .nav-brand-logo img { display: block; width: 200px; height: auto; }

    .brand {
      color: var(--nav-text);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      margin-right: 0.25rem;
    }
    .breadcrumb {
      color: var(--text-2);
      font-size: 0.83rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 1;
    }
    .breadcrumb a { color: #74c0fc; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    .nav-spacer { flex: 1; }

    .nav-logout {
      color: rgba(255,255,255,0.72);
      font-size: 0.8rem;
      text-decoration: none;
      padding: 0.25rem 0.6rem;
      border: 1px solid rgba(244,121,32,0.28);
      border-radius: 6px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      margin-right: 0.4rem;
      background: rgba(255,255,255,0.03);
    }
    .nav-logout:hover { background: rgba(244,121,32,0.14); color: #fff; border-color: rgba(244,121,32,0.5); }

    .theme-btn {
      width: 30px; height: 30px;
      border-radius: 6px;
      border: 1px solid rgba(244,121,32,0.28);
      background: rgba(244,121,32,0.08);
      color: var(--nav-text);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .theme-btn:hover { background: rgba(244,121,32,0.18); border-color: rgba(244,121,32,.45); }
    .icon-moon { display: flex; }
    .icon-sun  { display: none; }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun  { display: flex; }

    main { max-width: 1100px; margin: 1.75rem auto; padding: 0 1.25rem; }

    .card {
      background: var(--surface);
      border-radius: 10px;
      padding: 1.6rem;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-h)); color: #111; border: none;
      padding: 0.55rem 1.6rem; border-radius: 7px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.92; }
    .btn-sm {
      padding: 0.32rem 0.85rem; font-size: 0.79rem;
      background: var(--surface); color: var(--text-2);
      border: 1px solid var(--border);
      border-radius: 6px; text-decoration: none; display: inline-block;
      font-family: inherit; cursor: pointer; transition: background 0.12s;
    }
    .btn-sm:hover { background: var(--border); color: var(--text-1); }

    /* Badges */
    .badge {
      display: inline-block; font-size: 0.69rem; border-radius: 4px;
      padding: 0.15rem 0.45rem; font-weight: 700; letter-spacing: 0.02em;
    }
    .badge-ok   { background: var(--badge-ok-bg);   color: var(--badge-ok-text); }
    .badge-fail { background: var(--badge-fail-bg); color: var(--badge-fail-text); }
    .badge-na   { background: var(--badge-na-bg);   color: var(--badge-na-text); }

    /* Pills */
    .pills { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .pill {
      display: inline-block; font-size: 0.74rem;
      padding: 0.2rem 0.6rem; border-radius: 20px;
      background: var(--pill-bg); color: var(--pill-text);
    }
    .pill-matched { background: var(--pill-match-bg); color: var(--pill-match-text); font-weight: 500; }
    .pill-missing { background: var(--pill-miss-bg);  color: var(--pill-miss-text);  font-weight: 500; }

    /* Detail page */
    .cand-header { margin-bottom: 0; }
    .cand-name { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text-1); }
    .cand-meta {
      margin-top: 0.6rem; font-size: 0.87rem; color: var(--text-2);
      display: flex; flex-wrap: wrap; gap: 0.5rem 1.1rem; align-items: center;
    }
    .cand-meta a { color: var(--accent); text-decoration: none; }
    .cand-meta a:hover { text-decoration: underline; }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
    }
    .score-item label {
      font-size: 0.68rem; color: var(--text-3); font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      display: block; margin-bottom: 0.25rem;
    }
    .score-item .val { font-size: 1rem; font-weight: 700; color: var(--text-1); }

    .section { margin-top: 1rem; }
    .section h2 {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-3); margin-bottom: 1rem;
    }

    .exp-entry + .exp-entry { margin-top: 1.2rem; padding-top: 1.2rem; border-top: 1px solid var(--border-sub); }
    .exp-role    { font-weight: 700; font-size: 0.94rem; color: var(--text-1); }
    .exp-company { color: var(--text-2); font-size: 0.88rem; }
    .exp-dates   { font-size: 0.78rem; color: var(--text-3); margin-top: 0.15rem; }
    .exp-desc-text { font-size: 0.84rem; color: var(--text-2); margin-top: 0.45rem; line-height: 1.55; }

    .edu-entry + .edu-entry { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-sub); }
    .edu-degree { font-weight: 700; font-size: 0.94rem; color: var(--text-1); }
    .edu-inst   { color: var(--text-2); font-size: 0.87rem; }
    .edu-dates  { font-size: 0.78rem; color: var(--text-3); margin-top: 0.15rem; }

    .summary-text { font-size: 0.89rem; color: var(--text-2); line-height: 1.65; }

    .certs-list { list-style: disc; padding-left: 1.2rem; }
    .certs-list li { font-size: 0.87rem; color: var(--text-2); margin-bottom: 0.25rem; }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    @media (max-width: 700px) {
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand-logo" aria-label="Groz Engineering">
      <img src="/images/MicrosoftTeams-image.png" alt="Groz Engineering logo">
    </div>
    <a href="/" class="brand">Application Tracking System</a>
    {% block breadcrumb %}{% endblock %}
    <span class="nav-spacer"></span>
    <a href="/logout" class="nav-logout">Sign out</a>
    <button class="theme-btn" onclick="(function(){var h=document.documentElement,n=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('rp-theme',n);})()" title="Toggle theme" aria-label="Toggle dark mode">
      <span class="icon-moon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </span>
      <span class="icon-sun">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </span>
    </button>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
